[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khatamind"
version = "0.1.0"
description = "Relationship Memory Agent for MSMEs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.8",
    "alembic>=1.11.0",
    "asyncpg>=0.28.0",
    "apscheduler>=3.10.0",
    "httpx>=0.24.0",
    "openai>=1.0.0",
    "tenacity>=8.2.0",
    "structlog>=23.1.0",
    "hindsight-client>=0.1.0",
    "numpy>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.80.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
    "import-linter>=1.11.1",
    "pre-commit>=3.3.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.importlinter]
root_package = "khatamind"

[[tool.importlinter.contracts]]
name = "Dependency Rule for Domain"
type = "forbidden"
source_modules = ["khatamind.core.domain"]
forbidden_modules = ["khatamind.core.app", "khatamind.adapters", "khatamind.apps"]

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "simulation", "apps"]
